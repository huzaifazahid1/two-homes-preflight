# CI (Section N): typecheck, lint, unit, integration (Firebase emulators + MSW), E2E (Playwright,
# phone + desktop, production build against the emulators and the dev outbox), SE-1 bundle check.
# No secrets needed: every test layer reads only the committed .env.test. The real PayPal sandbox
# journey (npm run test:sandbox) is manual and never runs here.
name: ci

on:
  push:
    branches: [main, "phase-*"]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4 # Firebase emulators need Java 21+
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run test:integration

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:build
      - name: SE-1 secret names not in client bundle
        run: node scripts/check-bundle-secrets.mjs .next-e2e
      - run: npm run test:e2e
        env:
          E2E_SKIP_BUILD: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
